# cargo-deny over the whole graph, for the systems the product ships to (threat model V04, V23).

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
# Every advisory on the graph fails, unless it is accepted here with its reason.
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained: a build-time macro of gtk3-macros, under Tauri's GTK 3 webview on Linux, which has no maintained replacement" },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, not vulnerable, and has no safe upgrade: a direct workspace dependency of the regia crates only (clock, serde, std); the move to jiff or time is regia-tasks#669, which removes this line" },
]

[licenses]
# What the graph needs today, and nothing copyleft beyond MPL-2.0's file-level terms (Servo's CSS
# crates under Tauri). A new licence is a choice to make here, by hand.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# The workspace's own crates are not published and carry no licence yet.
private = { ignore = true }

[bans]
# Tauri's graph has many duplicates, none of them a choice of ours.
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "tauri:<2.11.6", reason = "GHSA-w28w-mhc8-qvjv and GHSA-7gmj-67g7-phm9: Tauri 2.11.6 or later (threat model §0, V04)" },
    # V03: plugins that would let the webview start processes, touch files or reach the network.
    { crate = "tauri-plugin-shell", reason = "processes start from the core, never from the webview (threat model §3.9, V03)" },
    { crate = "tauri-plugin-fs", reason = "the webview reads no file (threat model §3.9, V03)" },
    { crate = "tauri-plugin-http", reason = "the network is the core's: gh and, with consent, the usage probes (threat model §3.9, §3.12, V03)" },
    { crate = "tauri-plugin-opener", reason = "links are opened by the core, with its rules (threat model §3.7, V03)" },
    { crate = "tauri-plugin-process", reason = "the webview has no exit or restart (threat model §3.9, V03)" },
    { crate = "tauri-plugin-clipboard-manager", reason = "an XSS would read the clipboard (threat model §3.9, V03)" },
    { crate = "tauri-plugin-store", reason = "no secrets in the frontend (threat model §3.9, V03)" },
    { crate = "tauri-plugin-sql", reason = "no secrets in the frontend (threat model §3.9, V03)" },
    { crate = "tauri-plugin-stronghold", reason = "not the system keychain (threat model §3.9, V03)" },
    { crate = "tauri-plugin-deep-link", reason = "no deep links in v0.1 (threat model T09, V03)" },
    { crate = "tauri-plugin-autostart", reason = "autostart is a gate, outside v0.1 (threat model §3.9, V03)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
