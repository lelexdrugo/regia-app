[package]
name = "regia-app"
description = "The desktop app: a Tauri 2 shell over the same core as the CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Test only: the webview reports what it rendered and the app exits, after rendering the core's hostile
# corpus (threat model V07). Never in a release build.
smoke = ["regia-core/corpus"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
regia-core.workspace = true
# The registry of the projects, for the moviola's commands: a composition that belongs to regia-runtime.
regia-github.workspace = true
regia-i18n.workspace = true
regia-identity.workspace = true
regia-runtime.workspace = true
# The update channel, shared with the CLI's `self-update`; the plugin installs, from Rust only (threat model
# §3.9), after rfd's native confirmation (§3.8).
regia-update.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-updater.workspace = true
toml.workspace = true

# Tests only: ts-rs writes the TypeScript of the IPC types (src/ipc.rs), the core's corpus becomes the
# frontend proof's fixture, and Tauri's mock runtime runs the webview's calls through this build's ACL
# (V10). None of them reaches a release build.
[dev-dependencies]
# V21 on the plugin: keys and signatures made in the test, as `tauri signer` makes them.
base64.workspace = true
minisign.workspace = true
regia-core = { workspace = true, features = ["corpus", "ts"] }
tauri = { workspace = true, features = ["test"] }
ts-rs.workspace = true
