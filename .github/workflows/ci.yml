name: ci

# Minutes on a private repo are billed against a small monthly allowance, and macOS costs about ten
# times Linux. A push to main that touches the build runs Linux and Windows; the full matrix, with
# macOS, runs only by hand. Spike branches trigger nothing. The supply-chain, MSRV and release jobs
# run on Linux only, on every run: they read the lockfile or build for the same targets.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "deny.toml"
      - "app/**"
      - "crates/**"
      - "fixtures/**"
  workflow_dispatch:

# Queued, never cancelled: each pushed commit gets its verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["ubuntu-24.04","windows-2025","macos-15"]' || '["ubuntu-24.04","windows-2025"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: System packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build CLI, app and tools
        run: cargo build --workspace --locked
      - name: Only regia-exec starts a process (V12)
        run: cargo clippy --workspace --all-targets --locked -- -D clippy::disallowed-methods
      - name: Test, with the brief's conformance and regia-exec's checks
        run: cargo test --workspace --locked
      - name: Build the app for the smoke test
        run: cargo build -p regia-app --features smoke --locked
      - name: The app shows the CLI's brief, in each language (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./target/debug/app-smoke
      - name: The app shows the CLI's brief, in each language
        if: runner.os != 'Linux'
        run: ./target/debug/app-smoke

  supply-chain:
    name: cargo deny and cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: Advisories, bans with the Tauri floor, licences and sources (V04, V23)
        run: cargo deny --locked check
      - name: Advisories on the lockfile (V23)
        run: cargo audit

  msrv:
    name: build with Rust 1.90
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: System packages for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build everything with the minimum Rust
        run: cargo build --workspace --locked

  release:
    name: release profile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: System packages for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build the CLI and the app as they ship
        run: cargo build --release --locked -p regia-cli -p regia-app
