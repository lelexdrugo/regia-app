name: ci

# Minutes on a private repo are billed against a small monthly allowance, and macOS costs about ten
# times Linux. A push to main that touches the build runs Linux and Windows. macOS runs only by hand,
# as one job that builds what app-smoke starts and nothing else. A run by hand can also pick a single
# engine (`only`), to check WebKitGTK or WKWebView at the price of one job. Spike branches trigger
# nothing. The supply-chain, MSRV and release jobs run on Linux only: they read the lockfiles or build
# for the same targets.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "deny.toml"
      - "app/**"
      - "crates/**"
      - "fixtures/**"
  workflow_dispatch:
    inputs:
      only:
        description: "all: every job, with macOS. linux or macos: that engine's smoke leg alone."
        type: choice
        options: [all, linux, macos]
        default: all

# Queued, never cancelled: each pushed commit gets its verdict.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    if: github.event_name == 'push' || inputs.only != 'macos'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.only == 'linux' && '["ubuntu-24.04"]' || '["ubuntu-24.04","windows-2025"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: System packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb
          dpkg-query -W libwebkit2gtk-4.1-0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The frontend's dependencies, from the lockfile, without install scripts (V23)
        working-directory: app/ui
        run: npm ci --ignore-scripts
      - name: Types and Svelte's compile-time checks
        if: runner.os == 'Linux'
        working-directory: app/ui
        run: npm run check
      - name: The frontend the app embeds
        working-directory: app/ui
        run: npm run build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build CLI, app and tools
        run: cargo build --workspace --locked
      - name: Only regia-exec starts a process (V12)
        run: cargo clippy --workspace --all-targets --locked -- -D clippy::disallowed-methods
      - name: Test, with the brief's conformance, regia-exec's checks and the app's (V01-V05, V08-V10, V27, V28)
        run: cargo test --workspace --locked
      - name: Build the app for the smoke test
        run: cargo build -p regia-app --features smoke --locked
      - name: The app shows the CLI's brief, in each language, and passes its engine checks, V07 included (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a ./target/debug/app-smoke
      - name: The app shows the CLI's brief, in each language, and passes its engine checks
        if: runner.os != 'Linux'
        run: ./target/debug/app-smoke
      - name: What the engine reported
        if: always()
        shell: bash
        run: |
          for report in target/debug/conformance-state/smoke-*/smoke.json; do
            [ -f "$report" ] || continue
            node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              console.log(r.language, r.user_agent);
              for (const c of r.checks ?? []) console.log(c.ok ? "  ok  " : "  FAIL", c.name, "|", c.detail);' "$report"
          done
      # Last, and even after a failure above: they need only the frontend's dependencies. The runner's Chrome
      # is Chrome stable, which Ubuntu's AppArmor profile lets keep its sandbox.
      - name: The frontend's proofs in the runner's Chrome, under the app's CSP (contrast, catalog, limits, V07)
        if: runner.os == 'Linux' && !cancelled()
        working-directory: app/ui
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          google-chrome --version
          npm run prove

  macos:
    name: macos-15 (app-smoke)
    if: github.event_name == 'workflow_dispatch' && inputs.only != 'linux'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # No debug info: this job only runs the app and one test, and compiles and links faster without it.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The system and its WebKit
        run: |
          sw_vers
          defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString || true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The frontend the app embeds
        working-directory: app/ui
        run: npm ci --ignore-scripts && npm run build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # A branch's cache serves only that branch; main's serves every later run by hand.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build what app-smoke starts
        run: |
          cargo build --locked -p regia-cli -p regia-conformance --bin regia --bin fake-gh --bin app-smoke
          cargo build --locked -p regia-app --features smoke
      - name: The app shows the CLI's brief, in each language, and passes its engine checks (WKWebView)
        run: ./target/debug/app-smoke
      - name: What the engine reported
        if: always()
        shell: bash
        run: |
          for report in target/debug/conformance-state/smoke-*/smoke.json; do
            [ -f "$report" ] || continue
            node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
              console.log(r.language, r.user_agent);
              for (const c of r.checks ?? []) console.log(c.ok ? "  ok  " : "  FAIL", c.name, "|", c.detail);' "$report"
          done
      # The usage probes on macOS, where Claude's credentials are not looked for. Last, and even after a
      # failure above: the test builds on its own, and the budget needs only `regia`.
      - name: The usage probes' rules, on recorded answers
        if: ${{ !cancelled() }}
        run: cargo test -p regia-agents --test usage --locked
      # A home with the consent and nothing else: no credentials to find, and a proxy on a closed port,
      # so a probe that asked an endpoint would read unreachable and fail the check.
      - name: With consent and no credentials the budget reads unknown for both providers, and exits 0
        if: ${{ !cancelled() }}
        shell: bash
        env:
          REGIA_ENGINE: rust
          WANT_CLAUDE: "where Claude Code keeps its credentials on macOS is not proven: the probe does not read them"
          WANT_CODEX: "Codex's credentials were not found"
        run: |
          home="$RUNNER_TEMP/budget-home"
          mkdir -p "$home/Library/Application Support/regia"
          printf 'probes = "granted"\n' > "$home/Library/Application Support/regia/agents.toml"
          status=0
          env -u REGIA_CLAUDE_CREDENTIALS -u REGIA_CODEX_AUTH -u CLAUDE_CONFIG_DIR -u CODEX_HOME -u NO_PROXY -u no_proxy \
            HOME="$home" ALL_PROXY=http://127.0.0.1:9 \
            ./target/debug/regia budget --json > "$RUNNER_TEMP/budget.json" || status=$?
          cat "$RUNNER_TEMP/budget.json"
          [ "$status" -eq 0 ] || { echo "regia budget exited with $status, not 0"; exit 1; }
          node -e 'const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            let failed = 0;
            for (const [name, reason] of [["claude", process.env.WANT_CLAUDE], ["codex", process.env.WANT_CODEX]]) {
              const p = r.provider?.[name] ?? {};
              const ok = p.status === "unknown" && p.reason === reason;
              console.log(ok ? "  ok  " : "  FAIL", name, p.status, "|", p.reason);
              failed += ok ? 0 : 1;
            }
            process.exit(failed ? 1 : 0);' "$RUNNER_TEMP/budget.json"

  supply-chain:
    name: cargo deny, cargo audit and npm audit
    if: github.event_name == 'push' || inputs.only == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: Advisories, bans with the Tauri floor, licences and sources (V04, V23)
        run: cargo deny --locked check
      - name: Advisories on the lockfile (V23)
        run: cargo audit
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Advisories on what the frontend ships (V23)
        working-directory: app/ui
        run: npm audit --omit=dev

  msrv:
    name: build with Rust 1.90
    if: github.event_name == 'push' || inputs.only == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: System packages for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The frontend the app embeds
        working-directory: app/ui
        run: npm ci --ignore-scripts && npm run build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.90"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build everything with the minimum Rust
        run: cargo build --workspace --locked

  release:
    name: release profile
    if: github.event_name == 'push' || inputs.only == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: System packages for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: The frontend the app embeds
        working-directory: app/ui
        run: npm ci --ignore-scripts && npm run build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build the CLI and the app as they ship
        run: cargo build --release --locked -p regia-cli -p regia-app
      - name: No devtools in the release graph (V27)
        run: |
          cargo tree --locked -p regia-app -e normal,build,features -i tauri --target all > tauri-features.txt
          grep -q 'tauri feature "custom-protocol"' tauri-features.txt
          if grep -q 'tauri feature "devtools"' tauri-features.txt; then
            echo "the release graph turns on tauri's devtools feature"
            exit 1
          fi
