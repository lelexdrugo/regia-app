[package]
name = "moviola-bench"
version = "0.0.1"
description = "Spike: renderer benchmark for the moviola, inside a minimal Tauri 2 window"
edition = "2021"
publish = false

[lib]
name = "moviola_bench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde_json = "1"
base64 = "0.23"

[profile.release]
opt-level = 3
codegen-units = 16
