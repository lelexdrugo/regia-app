# Format v1 of the precheck (P1-P4 of the dossier's conformance study): the words of the prototype's
# `tools/precheck.py`, which its controller and the automation that runs it read in the outcome line. They
# are data, not identifiers, so they stay out of the Rust sources. The line keeps them as they are: a
# controller of either language reads the same line.

# The outcome line: the last line of stdout, one compact JSON object in ASCII, with its keys in this
# order. A longer line keeps only the counts, and a detail of an error only its first characters.
[line]
version = 1
max_length = 3500
detail_length = 300
diagnostic = "precheck:"

[line.keys]
version = "v"
outcome = "outcome"
exit = "exit"
reason = "motivo"
cursor = "cursore"
payload = "payload"
t = "t"

# The closed vocabulary: each outcome, its exit code and its reasons (P2). Exit 3 means nothing to do here,
# while in `lock`, `lease` and `step` it means refused (P3).
[outcomes.new_activity]
word = "new-activity"
exit = 0

[outcomes.new_activity.reasons]
ready = "pronti"
reports = "report-nuovi"
answers = "risposta-a-gate"
inbox = "inbox"
leases = "lease-scadute"
backlog = "da-formulare"
silent_workers = "worker-silente"

[outcomes.idle]
word = "idle"
exit = 3

[outcomes.idle.reasons]
no_event = "nessun-evento"
busy = "occupato"
wip_limit = "limite-wip"
budget = "budget"
proposals_exhausted = "proposte-esaurite"
waiting_on_owner = "attesa-del-titolare"
work_in_progress = "lavoro-in-corso"

[outcomes.terminal_state]
word = "terminal-state"
exit = 0

[outcomes.terminal_state.reasons]
objective_done = "obiettivo-fatto"
stall = "stallo"

[outcomes.error]
word = "error"
exit = 1

[outcomes.error.reasons]
tracker = "tracker"
runtime = "runtime"
unreadable = "illeggibile"
internal = "interno"

# The payload: the projects, each with its outcome and counts; the detail of an error; the counts alone
# when the line would be too long. After the projects: how the budget was decided, when it was asked, and
# the policy's source, why its file did not read, and its local override.
[payload]
projects = "progetti"
truncated = "troncato"
detail = "dettaglio"
budget = "budget"
policy = "politica"
policy_reason = "politica_motivo"
policy_local = "politica_locale"

# An entry of `projects`, in the order of its keys. The counts after `events` are written in this order,
# the optional ones only when they apply; `tasks` holds the first ready tasks.
[project]
id = "id"
outcome = "esito"
reason = "motivo"
events = "eventi"
ready = "pronti"
reports = "report"
answers = "gate"
inbox = "inbox"
leases = "lease"
silent = "silenti"
blocked_by_wip = "bloccati_wip"
in_progress = "in_corso"
waiting_on_owner = "attesa_titolare"
backlog = "arretrato"
proposals = "proposte"
tasks = "task"
max_tasks = 10
backlog_tasks = "arretrato_task"
# The workers of the tasks in progress (#210 and #641 of the dossier): how many are silent and how many blocked in
# a new episode, counted among the events after `leases`, and their tasks after `backlog_tasks`. `blocked` is not
# `blocked_by_wip`, the ready tasks the wip holds back.
blocked = "bloccati"
silent_tasks = "silenti_task"
blocked_tasks = "bloccati_task"
# The tasks of the owner's answers outside Decision and Proposal (#393): where the step looks for them, the first
# `max_tasks` by number, after the workers' tasks.
answer_tasks = "risposte_task"

# The owner's answers (§6.4 of the design note). On an issue that waits for the owner, a comment newer than the
# step's instant that the step did not write, the regia did not sign and that is no consultation (#68: it starts
# with `consultation` and never wakes, whoever signs it). An issue that waits and did not change since
# `stale_margin_s` before that instant is not read (#589): a new or edited comment moves its `updatedAt`. The
# answers outside Decision and Proposal (#393) come from one read a project of the comments of its issues updated
# after the instant, open or closed: at most `recent_s` seconds of it, `recent_total_s` for every project of a
# tick, and none with less than `recent_margin_s` seconds left before the tick's deadline. That read never fails
# the tick: whatever goes wrong, it is as if it had not been made.
# The workers of the tasks in progress (#210, #641 of the dossier, ADR 0027): when each last wrote, from Orca's
# adapter, read once a tick while the tracker is read, in at most `read_s` seconds, never with less than
# `margin_s` left before the tick's deadline, and waited for `grace_s` more. A worker silent past the policy's
# threshold that waits for nobody is one event, once an episode: from the instant its threshold passed, when that is
# after the cursor's. One blocked past the block's threshold is another, never both, with the same reason. No data
# is no silence: Orca missing, slow or failing leaves the tick as it was.
[workers]
read_s = 25.0
margin_s = 15.0
grace_s = 2.0

[answers]
consultation = "Consultazione:"
stale_margin_s = 120.0
recent_s = 12.0
recent_total_s = 15.0
recent_margin_s = 20.0

# The backlog to formulate (§6.4 point 11 of the design note, #211): every Inbox item and every approved
# draft, when the wip has room, except a parent with open sub-issues, a blocked task and an item with this
# label.
[backlog]
parked = "parcheggiato"

# An entry of `cursor`: each project observed, with the instant its events cursor holds.
[cursor]
project = "progetto"
value = "valore"

# The events cursor, as a step's end writes it: the same words as `[events]` of `regia-store`'s
# `store_v1.toml`, read here as the prototype's precheck reads them.
[events]
t = "t"
own = "propri"
comments = "commenti"
reports = "report"

# The budget's gate (§6.4 point 6 of the dossier's design note): Claude's 5-hour window, from the cache of
# the usage probes, asked only when a project has new activity. A reading younger than `fresh_s` is known;
# an older one of the same window, below the threshold, is known and stale; anything else is unknown, with
# its reason cut to `reason_length` characters. The reasons are the prototype's sentences: `{reason}` is
# what the probe said, `{hours}` an age in hours to one decimal, `{pct}` a share as Python's `:g` writes it.
[budget]
provider = "claude"
window = "5h"
pct = "claude_5h_pct"
not_open = "aperta"
stale = "stale"
age = "eta_s"
reason = "motivo"
fresh_s = 3600
reason_length = 160
no_data = "nessun dato di budget in cache"
probe_failed = "sonda: {reason}"
joined = "{reason}; {old}"
same_window_above = "dato della stessa finestra di {hours} h fa, già sopra la soglia ({pct} %)"
window_not_open = "ultimo dato valido di {hours} h fa, con la finestra di 5 h non ancora aperta"
window_expired = "ultimo dato valido di {hours} h fa, finestra di 5 h scaduta"
# #466, names of the product that the prototype does not have (provisional, for the gate of names, #223).
# The probes the user refused, and a provider the probes never read on this system (Claude on macOS,
# #463): the gate is open, backfill is held, and nothing counts towards the alarm. A reading that failed
# `alarm_rounds` ticks in a row, each with work waiting, raises the alarm: still no launch, and the text
# names the setting that turns the probes off.
probe = "sonda"
probes_off = "spenta"
never_read = "non-letta"
rounds = "giri"
since = "da"
alarm = "allarme"
alarm_rounds = 4
alarm_text = "the usage probes have not read Claude's budget for {rounds} ticks in a row, and no step starts without it: to start steps with no budget, turn the probes off in the settings (probes = \"refused\" in agents.toml)"

# The policy's source as the prototype names it, and its local override's description, in the prototype's
# keys and words (`tools/politica_budget.py` of the dossier).
[policy]
file = "file"
default = "default"
with_local = "+locale"
status = "stato"
until = "fino"
values = "valori"
note = "nota"
set_at = "impostato"
reason = "motivo"

[policy.statuses]
active = "attivo"
expired = "scaduto"
unreadable = "illeggibile"
ignored = "ignorato"

# The keys of the override's values, by the contract's name of each.
[policy.levers]
automatic_max_pct = "automatico_max_pct"
backfill_max_pct = "riempimento_max_pct"
open_per_project = "aperte_per_progetto"
new_per_week = "nuove_per_settimana"
proposal_caps = "tetti_proposte"
backfill = "riempimento"

# The detector's own accounting (§6.3 of the design note): one row a project, under this cursor's name,
# which is the only thing the precheck writes. The budget's alarm keeps its count in the row of the
# project the controller reserves for every project (#466, provisional).
[detector]
cursor = "rilevatore"
version = "v"
global_project = "controller"
budget = "budget"

# The series of a stall (§6.3): the ticks in a row that observed the same facts, by their digest, from
# when, and the controller's postponements already seen, the project's and the global one. A stall is at
# least `--stallo-n` ticks and `--stallo-s` seconds; reported, it waits for the owner until `--rialert-s`
# has passed since the report the alerting step wrote in its own cursor, or while the Objective is in
# decision. The digest's tags name what it holds: a held lock, or the events with the backlog.
[series]
key = "serie"
digest = "digest"
count = "n"
since = "da"
last = "ultimo"
seen = "visti"
seen_project = "p"
seen_global = "g"
postponed = "rinviato"
postponement = "rinvio"
postponement_t = "t"
postponement_id = "id"
reports = "segnalazioni"
reported = "stallo:{digest}"
lock = "lock"
held = "occupato"
contended = "illeggibile"
events = "ev"
backlog = "arretrato"
# The episodes of the workers, each a task with the instant its threshold passed (#210, #641), before the backlog.
silent = "silenti"
blocked = "bloccati"
digest_length = 12

# The arguments of the prototype's command line, and their defaults. A wrong argument is an error of the
# precheck, exit 1, never the parser's 2.
[options]
project = "--progetto"
stall_n = "--stallo-n"
stall_s = "--stallo-s"
realert_s = "--rialert-s"
budget_max = "--budget-max"
deadline_s = "--scadenza-s"

[options.defaults]
stall_n = 3
stall_s = 3600.0
realert_s = 86400.0
deadline_s = 100.0
