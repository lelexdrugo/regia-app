# Format v1 of the machine-local state, as the prototype writes it (`tools/runtime.py` and ADR 0008 of
# the dossier). Both implementations read and write these rows while they coexist, so the names stay
# as they are. They are data, not identifiers, and stay out of the Rust sources (ADR 0001, sections 7
# and 12).

# The one table of `regia.db`.
[table]
name = "documenti"
kind = "tipo"
key = "chiave"
generation = "gen"
document = "doc"

# Values of the kind column.
[kinds]
lock = "lock"
lease = "lease"
cursor = "cursore"
cache = "cache"
probe = "sonda"

# The fields of a lock document, in the order the prototype writes them.
[lock]
project = "progetto"
holder = "proprietario"
taken_at = "preso"
ttl_s = "ttl_s"
expires_at = "scade"
replaced = "al_posto_di"
stolen_at = "rubato_il"
renewed_at = "rinnovato"

# The fields of a lease document, in the order the prototype writes them: the lease of a task in
# progress, kept alive by heartbeats. Its row has the task's number, in digits, for its key, and the
# number is stored again as a JSON integer, which the precheck matches against the tracker's numbers.
[lease]
task = "task"
project = "progetto"
holder = "proprietario"
taken_at = "preso"
heartbeat_at = "battito"
ttl_s = "ttl_s"
expires_at = "scade"
replaced = "al_posto_di"
stolen_at = "rubato_il"

# A cursor's document: its value and when it was written. The events cursor of a project has the
# project's id for its key, as it always had; any other cursor `<project>:<name>`, its name with the
# pattern of a project's id.
[cursor]
value = "valore"
updated = "aggiornato"
events = "eventi"
step = "passo"

# The value of the step cursor while an orchestrator's step is open, `null` once it closed: who opened
# it, the session that did, when it began to observe, and the comments it wrote.
[step]
version = "v"
holder = "proprietario"
session = "sessione"
t = "t"
comments = "commenti"
# A holder the step generates when it has neither one given nor a session: this and 12 hex digits.
generated_holder = "passo-"
# The word of the dossier's commit that closes a step: `<project>: <word> <t>`.
commit_word = "passo"

# The value of the events cursor: when the last step began to observe, and what it wrote or processed
# itself, which the precheck does not count as new. `reports` maps a report's file name to its date.
[events]
version = "v"
t = "t"
own = "propri"
comments = "commenti"
reports = "report"
# Where those reports are, relative to the project's folder, with `/` between the parts.
report_folder = ".regia/report"

# The log of what sessions declare they work on (R8, `tools/dichiarazioni.py`): under the state folder,
# `<folder>/<session>.<pid>.jsonl`, appended to, one JSON object a line with its keys in this order and a
# field without a value left out. `ids` are the variables a session's ids come from, in order, each with
# the key it is written with: the first one set is the line's session, and its key the line's agent. A
# step's commands record `step_role`; the others the role of the prototype's variable, if one is set.
[declarations]
folder = "dichiarazioni"
version = "v"
ts = "ts"
session = "sessione"
agent = "agente"
project = "progetto"
task = "task"
command = "comando"
role = "ruolo"
ids = [["CLAUDE_CODE_SESSION_ID", "claude"], ["ORCA_AGENT_SESSION_ID", "orca"], ["CODEX_THREAD_ID", "codex"]]
step_role = "orchestratore"

# The compaction of that log (#471): the files of a session and a process merge into one file a month,
# `<month_prefix>AAAA-MM.jsonl`, which the prototype's reader reads as any other file of the log. A file written
# within `quiet_hours` stays as it is. `plan` is the plan of a run, which the reader does not read. Both names are
# provisional, for the gate of names.
[compaction]
month_prefix = "compattate-"
plan = "compattazione.json"
quiet_hours = 24

# The work files of a task (the class `passaggio` of the dossier's ADR 0019): `<cache>/<folder>/<project>/<task>/`,
# removed `after_days` after the task closed. The cache is the system's folder for it (ADR 0019 §5).
[work]
folder = "lavoro"
after_days = 30

# The monotonic expiry the prototype adds to every lock, lease and probe document. `clock` names the
# implementation of the clock that wrote it: a reader with another one falls back to `expires_at`.
[monotonic]
key = "_m"
written = "t"
expires = "scade"
clock = "o"

# Fields no view shows: the probe's fencing token and the monotonic stamp.
[view]
hidden = ["token", "_m"]

# The budget cache (kind `cache`) and the claim of the probe that refreshes it (kind `probe`), one row
# each at this key. For each provider the cache keeps the last valid reading, with when it was read,
# and the last reading, valid or not. Its monotonic stamp has `written` and `clock`, no `expires`.
[budget]
key = "budget"
providers = "provider"
valid = "valido"
valid_at = "valido_il"
last = "ultimo"
attempted_at = "ultimo_tentativo"
# The claim: its fencing token, and its expiry on the wall clock.
claim_token = "token"
claim_expires_at = "scade"

# A provider's reading, as the prototype's probes write it (`tools/usage.py`).
[usage]
provider = "provider"
status = "stato"
plan = "piano"
windows = "finestre"
reason = "motivo"
token = "token"

# A window of a reading.
[usage_window]
status = "stato"
used_pct = "usato_pct"
remaining_pct = "residuo_pct"
reset = "reset"
reset_in_s = "reset_tra_s"
open = "aperta"
reason = "motivo"

# Codex's token, from its expiry alone: never the token itself.
[usage_token]
status = "stato"
expires_at = "scade"
expires_in_s = "scade_tra_s"
reason = "motivo"
http_status = "codice_http"

# The values of a reading's and a window's status. There is no value for probes the user refused:
# such a reading is never stored.
[usage_statuses]
ok = "ok"
unknown = "sconosciuto"

[token_statuses]
valid = "valido"
expiring = "in_scadenza"
expired = "scaduto"
unknown = "sconosciuto"
refused = "rifiutato"
