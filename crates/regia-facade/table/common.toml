# The facade table (ADR 0017 §4, ADR 0001 "Facade"). Disposable: it disappears with the Python.
#
# One file per group of commands, so slices that add commands do not edit the same file. The build
# embeds every file of this folder, and a name defined in two files is an error. This file holds what
# the groups share.
#
# Translation walks the JSON by shape, so data is never touched: a project called like a key stays
# as it is. It fails closed on keys and on listed enums: an unknown one is an error. Values of other
# fields pass as they are, so tracker labels and the prototype's prose stay in its language; they are
# data, not contract. A key that goes missing is caught by the conformance diff, not here. A shape
# marked `open` lets the keys it does not list pass as data, for a free block such as a project's
# registry; two keys that land on one name are still an error.
#
# Arguments translate by the same table. An option is renamed and takes a value unless it is a
# `flag`; the value passes as it is, or through the enum the table names for it. Positional arguments
# follow `positionals`, in order. A command without `output` prints text, which passes as it is.
# Only the commands listed in this folder exist for the facade.
schema = 1

[enums.status]
"Inbox" = "inbox"
"Proposta" = "proposal"
"Approvato" = "approved"
"In corso" = "in_progress"
"Decisione" = "decision"
"Fatto" = "done"
"Scartato" = "discarded"
# Key of the per-project counts for a task with no status.
"—" = "unset"

[enums.maturity]
abbozzo = "draft"
pronto = "ready"

[shapes.task.fields]
number = { to = "number" }
title = { to = "title" }
state = { to = "state" }
stateReason = { to = "state_reason" }
stato = { to = "status", enum = "status" }
progetto = { to = "project" }
campo_progetto = { to = "project_field" }
maturita = { to = "maturity", enum = "maturity" }
obiettivo = { to = "objective" }
labels = { to = "labels" }
parent = { to = "parent" }
sub = { to = "sub_issues" }
bloccato_da = { to = "blocked_by" }
bloccato_da_totale = { to = "blocked_by_total" }
url = { to = "url" }
updatedAt = { to = "updated_at" }
createdAt = { to = "created_at" }
closedAt = { to = "closed_at" }
sblocca = { to = "unblocks" }
sblocca_totale = { to = "unblocks_total" }
catena = { to = "chain" }
ciclo = { to = "cycle" }
entro = { to = "due" }
entro_vicino = { to = "due_soon" }
entro_scaduto = { to = "overdue" }
