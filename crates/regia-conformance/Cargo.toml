[package]
name = "regia-conformance"
description = "Dev only. Proves the rewrite right: the same cases on both implementations, through the same facade table."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Stands in for the real `gh`. It only answers from a fixture file. The prototype finds it first on
# PATH; the product gets a copy at an absolute path, with the fixture named beside it.
[[bin]]
name = "fake-gh"
path = "src/bin/fake_gh.rs"

# Stands in for `git` in the cases of a git that does not answer: it ends every call with the exit
# code of a deadline, 124. The prototype finds it first on PATH, the product by `REGIA_GIT`.
[[bin]]
name = "fake-git"
path = "src/bin/fake_git.rs"

# A stand-in for `orca`: the four reads of the workers of the precheck (#599), from a run's fixture.
[[bin]]
name = "fake-orca"
path = "src/bin/fake_orca.rs"

# Stands in for the interpreter where the prototype is not, as in CI: checks the argv the facade
# built and replays what the prototype printed for a case, with its exit code.
[[bin]]
name = "fake-python"
path = "src/bin/fake_python.rs"

# Stands in for any program regia-exec starts, in the tests of `tests/exec.rs`: it prints its argv,
# stdin, environment and folder.
[[bin]]
name = "probe"
path = "src/bin/probe.rs"

# Local only: needs the private dossier. Regenerates the fixtures from the Python oracle.
[[bin]]
name = "record"
path = "src/bin/record.rs"

# Local only: both implementations against the real tracker. Prints paths and counts, never data.
[[bin]]
name = "live-check"
path = "src/bin/live_check.rs"

# Starts the real app on a fixture, in each language, and compares what the webview rendered.
[[bin]]
name = "app-smoke"
path = "src/bin/app_smoke.rs"

# One process on a state database, for the store tests that need two of them or one per language.
[[bin]]
name = "store-probe"
path = "src/bin/store_probe.rs"

[dependencies]
regia-core.workspace = true
regia-exec = { workspace = true, features = ["harness"] }
regia-facade.workspace = true
regia-i18n.workspace = true
regia-identity.workspace = true
regia-runtime.workspace = true
regia-store.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true

[dev-dependencies]
chrono.workspace = true
proptest = { version = "1", default-features = false, features = ["std"] }
# The controller's tick, in process, for its cases and the traces of #436 (#467).
regia-agents.workspace = true
regia-controller = { path = "../regia-controller" }
