# Format v1 of the dossier, as the prototype reads and writes it (`tools/regia.py`, ADR 0011 of the
# dossier). Both implementations commit these files while they coexist, so the names stay as they are.
# They are data, not identifiers, and stay out of the Rust sources (ADR 0001, sections 7 and 12).

# What a checkpoint commits besides the files it is given, relative to the project's folder: the
# prototype's `DOSSIER_FILE`. A folder stands for every file under it.
[named]
files = [".regia/stato.md", ".regia/decisioni.md", ".regia/journal"]

# The archives of the decisions, which a checkpoint also commits when they changed (ADR 0024 of the
# dossier, #583): the prototype's `ARCHIVIO_DECISIONI_RE`, `decisioni-[0-9]{4}-[0-9]{2}\.md`. They are
# listed by name, one read of the folder, because the paths a checkpoint gives git are literal and a
# pattern would not stand for them. Only files, and only directly in `folder`, not in its subfolders.
# In `name`, `#` stands for one ASCII digit and any other character for itself.
[named.archives]
folder = ".regia"
name = "decisioni-####-##.md"
