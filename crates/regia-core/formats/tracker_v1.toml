# Format v1 of the tracker: strings the prototype wrote into GitHub, read as they are (ADR 0017,
# "Data"). They are data, not identifiers, so they stay out of the Rust sources. Format v2 and
# `migrate` belong to the sub-issue of the epic.

[labels]
project_prefix = "progetto:"
objective = "tipo:obiettivo"
session = "sessione"

[labels.maturity]
draft = "maturità:abbozzo"
ready = "maturità:pronto"

# Single-select fields of the Project read by their name, as the prototype reads them. The project field mirrors the
# project label (ADR 0021 of the dossier): the label stays the source, and the field's value is reported as it is.
[fields]
project = "Progetto"

# The first YAML block of an issue's body is its spec. Its optional due line is `<due_key>: YYYY-MM-DD`, and the
# template's placeholder, copied as it is, means no date (#244 of the dossier).
[body]
due_key = "entro"
due_placeholder = "AAAA-MM-GG"

# The registry of a project: the first block `<!-- <marker> … -->` in the body of its Objective, one
# `key: value` a line (R1 of the dossier's conformance study). The block is open: a key written by hand
# is kept. `no_products` are the values of the products' key that mean none, in lower case.
[registry]
marker = "regia:progetto"
no_products = ["", "-", "—", "nessuno", "nessuna"]

# An entry of `projects`, key by key: the prototype's name → the contract's (R2, R6). The first four
# come from the Objective, the others from the block; a key of the block of the same name wins, as in
# the prototype. Any other key of the block passes with its name as it is.
[registry.keys]
id = "id"
obiettivo = "objective"
titolo = "title"
stato = "status"
cartella = "folder"
playbook = "playbook"
priorita = "priority"
wip = "wip"
default_automatici = "auto_defaults"
repo = "repo"
prodotti = "products"

# The signature of a comment written by the CLI (M1, M2 of the conformance study): the body, a blank
# line, a visible line, and last a hidden marker `<!-- <marker> <role_key>=<role> <session_key>=<id> -->`.
# A comment without a marker is the owner's. A worker's comment is its report, so it reads as one line:
# the report's `summary_key`, or its first line.
#
# The roles (M3): `owner` for a decision of the owner relayed by a chat, `orchestrator` for the session
# whose step of the issue's project is open, `worker` and `chat` by hand, `chat` without a role. The
# marker of a comment written with no session has `no_session` for its id.
[signature]
marker = "regia:autore"
role_key = "ruolo"
session_key = "sessione"
no_session = "-"
owner = "titolare"
orchestrator = "orchestratore"
worker = "worker"
chat = "chat"
visible_role_prefix = "regia ·"
visible_owner = "il titolare, via chat"
summary_key = "riassunto"
summary_max = 240

# Option label in `status_options` of tracker.json → canonical id. Only used once, when the config
# is loaded, to bind each option id to its canonical id. From then on status is by option id.
[status_labels]
"Inbox" = "inbox"
"Proposta" = "proposal"
"Approvato" = "approved"
"In corso" = "in_progress"
"Decisione" = "decision"
"Fatto" = "done"
"Scartato" = "discarded"

# The labels `setup` and `init` create on the tracker, in this order, each with a fixed color and description (T6 of
# the dossier's conformance study). The first three and the last are the labels of `[labels]`.
[[base_labels]]
name = "tipo:obiettivo"
color = "0e8a16"
description = "Issue Obiettivo di un progetto (contiene il registro)"

[[base_labels]]
name = "maturità:abbozzo"
color = "c5def5"
description = "Segnaposto: spec da scrivere"

[[base_labels]]
name = "maturità:pronto"
color = "1d76db"
description = "Spec completa: eseguibile se Approvato e sbloccato"

[[base_labels]]
name = "parcheggiato"
color = "fbca04"
description = "Fuori dall'arretrato da scodare: il motivo sta in un commento"

[[base_labels]]
name = "sessione"
color = "d93f0b"
description = "Il memo propone una sessione di approfondimento con il titolare"
