# The moviola's files in a project's dossier, as the prototype writes them (`docs/moviola/CONTRATTO.md` of the
# dossier, §3 and §5, schemas `moviola.*/v0`): where they are, the keys of their records and the words of their
# closed lists. They are data of format v1, not identifiers, and stay out of the Rust sources. Each table maps
# the product's name of a field (left) to the prototype's key (right); the product's names are provisional,
# for the gate of the names (#223 of the dossier).

# `<project folder>/.regia/moviola/`, one segment each.
folder = [".regia", "moviola"]
milestones = "milestones.jsonl"
directions = "direzioni.jsonl"
aggregates = "aggregati.jsonl"
# `snapshot/<milestone id>.json`: the sidecars.
snapshots = "snapshot"
snapshot_extension = "json"
# The implicit direction, which has no record (§5.7).
main_direction = "principale"
# What `consolidate` writes in a row of the aggregates (§5.2, §5.7): the schema, and the `via` of a model that a
# report's session field brought.
aggregate_schema = "moviola.aggregato/v0"
via_report = "report"

[milestone]
id = "id"
ts = "ts"
kind = "tipo"
title = "titolo"
direction = "direzione"
parents = "genitori"
health = "salute"
opens_direction = "apre_direzione"
refs = "rif"
process = "processo"
author = "autore"

[refs]
issue = "issue"
commit = "commit"
report = "report"

[process]
round = "round"
checks = "controlli"
defects = "difetti"

[defects]
found = "trovati"
closed = "chiusi"
closes = "chiude"

[author]
role = "ruolo"
agent = "agente"
model = "modello"
session = "sessione"

[direction]
id = "id"
title = "titolo"
opened_by = "aperta_da"
status = "stato"
reason = "motivo"

[aggregate]
schema = "schema"
project = "progetto"
task = "task"
window = "finestra"
round = "round"
declared_subagents = "sottoagenti_dichiarati"
models = "modelli"
checks = "controlli"
defects = "difetti"
tokens = "token"

[model]
agent = "agente"
model = "modello"
effort = "effort"
sessions = "sessioni"
via = "via"

[check]
kind = "tipo"
outcome = "esito"
defects = "difetti"
model = "modello"

[tokens]
input = "in"
output = "out"
cache_read = "cache_lettura"
cache_write = "cache_scrittura"

[snapshot]
id = "id"
ts = "ts"
changed = "cambiato"
direction = "direzione"
open_decisions = "decisioni_aperte"
risks = "rischi"
next = "prossimo"
in_brief = "in_breve"
changed_claims = "claim_cambiati"
deviations = "deviazioni"
process = "processo"

[deviation]
plan = "piano"
deviation = "deviazione"
reason = "motivo"
impact = "impatto"

# The closed lists the prototype's `registra` enforces (§5.3, §5.4, §5.7): the product's id (left), the
# prototype's word (right).
[kinds]
milestone = "milestone"
decision = "decisione"
gate = "gate"
exception = "eccezione"
exploration = "esplorazione"
rejoin = "rientro"
abandonment = "abbandono"

[health]
healthy = "in salute"
at_risk = "a rischio"
waiting_on_owner = "in attesa del titolare"

[direction_status]
active = "attiva"
abandoned = "abbandonata"
rejoined = "rientrata"

# The raw activity store (§3, §4, §5.1, §5.6): one for every project, outside git, a JSONL file a month named
# `YYYY-MM.jsonl`. The prototype's variable moves it; else it is this folder under the state folder.
[store]
variable = "MOVIOLA_ATTIVITA"
folder = "attivita"
month_extension = "jsonl"
retention_days = 90
# The key of a dispatch's record is this word, a colon and the dispatch.
dispatch_prefix = "dispatch"
# `<project>#<task>` → the fingerprint of the task's records when `consolidate` wrote its row, and the instant.
consolidated = "consolidati.json"
fingerprint = "impronta"
stamp = "ts"

# The keys of a raw record (§5.1, §5.6) that the store and `consolidate` read.
[record]
start = "ts_inizio"
end = "ts_fine"
project = "progetto"
task = "task"
agent = "agente"
model = "modello"
effort = "effort"
session = "sessione"
source = "fonte"
dispatch = "dispatch"
attribution = "attribuzione"
tokens = "token"
outcome = "esito"
# The outcome of a dispatch still open.
running = "in-corso"

# The worker's report (ARCHITECTURE §5.2 of the dossier, `.regia/report/YYYY-MM-DD-<N>-<slug>.md`): where the reports
# are, and the fields of its front matter the moviola reads, in this order. Its checks have the aggregate's keys
# (`[check]`).
[report]
folder = [".regia", "report"]
extension = "md"
kind = "tipo"
task = "task"
stop_reason = "stop_reason"
round = "round"
session = "sessione"
subagents = "sottoagenti"
checks = "controlli"
closed_defects = "difetti_chiusi"
